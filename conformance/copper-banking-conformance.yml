    mcp.getcopper.com serves authorization_endpoint/token_endpoint and returns RFC 6749
    error objects (invalid_request) on malformed requests.
- id: rfc8414-authorization-server-metadata
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    HTTP 200 application/json at
    https://mcp.getcopper.com/.well-known/oauth-authorization-server with issuer,
    authorization_endpoint, token_endpoint, registration_endpoint, response_types_supported,
    grant_types_supported, scopes_supported and code_challenge_methods_supported.
- id: rfc7636-pkce
  name: Proof Key for Code Exchange (RFC 7636)
  conforms: true
  evidence: 'code_challenge_methods_supported: ["S256"] in the authorization server metadata.'
- id: rfc7591-dynamic-client-registration
  name: OAuth 2.0 Dynamic Client Registration (RFC 7591)
  conforms: true
  evidence: >-
    registration_endpoint https://mcp.getcopper.com/register is live and returns
    {"error":"invalid_client_metadata"} on an empty registration body, i.e. it validates
    client metadata per the spec.
