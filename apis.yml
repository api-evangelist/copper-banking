aid: copper-banking
name: Copper Banking
description: 'Copper (Copper Banking) is a Seattle-based consumer fintech founded in
  2019 by Eddie Behringer and Stefan Berglund that began as a teen banking app and debit
  card built on the Synapse banking-as-a-service platform. After Synapse''s collapse
  Copper abruptly discontinued its bank deposit accounts and debit cards in May 2024
  and repositioned as a financial-empowerment and earning app, where members earn cash
  and gift-card rewards through cash back, surveys, receipt scanning, games and referrals,
  alongside financial-literacy content, guides and in-school workshops. Copper publishes
  no public developer portal, documentation or API specification; the only machine-readable
  surface reachable without credentials is an OAuth 2.0 authorization server for a
  Model Context Protocol endpoint at mcp.getcopper.com.'
