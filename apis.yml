apis:
- name: Copper MCP Server
  description: 'An undocumented Model Context Protocol server operated by Copper at
    mcp.getcopper.com. The host publishes RFC 8414 OAuth 2.0 Authorization Server Metadata
    at /.well-known/oauth-authorization-server declaring the `mcp` and `offline_access`
    scopes, authorization-code grant with PKCE (S256), refresh tokens, and RFC 7591
    dynamic client registration. The MCP transport endpoint itself was not discoverable
    at any conventional path anonymously, so the tool list and input schemas could not
    be introspected. Copper publishes no documentation for this surface.'
  humanURL: https://www.getcopper.com/
  baseURL: https://mcp.getcopper.com/
